<body>
    <div class="header">
        <a href="index.html"><img class="logo" src="images/images.png" width="100px" /></a>

            <a href="Home.html">Home</a>
            <a href="shop.html">Our Shop</a>
            <a href="contacts.html">Contacts</a>

    <div class="signin-container">
        <div class="signin-box">
            <span>Welcome Back</span>
            <h2>Sign In To LUGX</h2>
            <form>
                <input type="email" placeholder="Email Address..." required>
                <input type="password" placeholder="Password..." required>
                <div class="form-options">
                    <label><input type="checkbox"> Remember me</label>
                    <a href="#">Forgot Password?</a>
                </div>
                <button type="submit" class="ptn">Sign In Now</button>
            </form>
            <p class="register-link">Don't have an account? <a href="#">Create Account</a></p>
        </div>
    </div>
